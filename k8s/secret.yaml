apiVersion: v1
kind: Secret
metadata:
  name: mekano-secret
  namespace: mekano-system
type: Opaque
# TEMPLATE ONLY. Never commit real credentials/private keys.
# The CD workflow recreates this Secret from GitHub Actions Secrets.
stringData:
  DB_USER: "mekano"
  DB_PASSWORD: "CHANGE_ME"
  EVOLUTION_API_KEY: "REPLACE_WITH_EVOLUTION_API_KEY"
  EVOLUTION_WEBHOOK_TOKEN: "REPLACE_WITH_EVOLUTION_WEBHOOK_TOKEN"
  privatekey.pem: |-
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_ED25519_PRIVATE_KEY
    -----END PRIVATE KEY-----
  publicKey.pem: |-
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_ED25519_PUBLIC_KEY
    -----END PUBLIC KEY-----
