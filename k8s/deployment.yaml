apiVersion: apps/v1
kind: Deployment
metadata:
  name: mekano
  namespace: mekano-system
  labels:
    app: mekano
    app.kubernetes.io/name: mekano-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mekano
  template:
    metadata:
      labels:
        app: mekano
        app.kubernetes.io/name: mekano-api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 185
      containers:
        - name: mekano
          # Use a templated/immutable tag rather than :latest in the repo.
          # The pipeline should substitute IMAGE_TAG with the actual sha/tag.
          image: ghcr.io/fiap-software-architecture-team/mekano-api:{{IMAGE_TAG}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mekano-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mekano-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mekano-secret
                  key: DB_PASSWORD
            - name: SMALLRYE_JWT_SIGN_KEY_LOCATION
              value: /home/jboss/.mekano/secrets/privatekey.pem
            - name: MP_JWT_VERIFY_PUBLICKEY_LOCATION
              value: /home/jboss/.mekano/secrets/publicKey.pem
          volumeMounts:
            - name: jwt-keys
              mountPath: /home/jboss/.mekano/secrets
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: jwt-keys
          secret:
            secretName: mekano-secret
            defaultMode: 0400
            items:
              - key: privatekey.pem
                path: privatekey.pem
              - key: publicKey.pem
                path: publicKey.pem
