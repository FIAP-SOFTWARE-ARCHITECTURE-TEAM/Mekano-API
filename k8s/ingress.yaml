apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mekano
  namespace: mekano-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: mekano.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mekano
                port:
                  number: 8080
