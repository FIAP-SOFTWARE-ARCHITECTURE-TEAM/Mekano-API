apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: mekano
  namespace: mekano-system

  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: mekano
                port:
                  number: 8080