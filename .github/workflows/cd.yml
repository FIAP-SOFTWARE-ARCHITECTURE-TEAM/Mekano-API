# CD — Mekano-API
#
# Pipeline de APLICACAO: build/testes + publicacao da imagem Docker no GHCR.
# A infraestrutura (VPC/EKS/RDS/peering) e o deploy no cluster vivem nos repos:
#   - Mekano-Infrastructure-K8s  (Terraform EKS/VPC + kubectl deploy, le a imagem daqui)
#   - Mekano-Infrastructure-Database (Terraform RDS)
#   - Mekano-Serverless (Lambda de autenticacao CPF/JWT)
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mekano-api-cd
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  build-test:
    name: Build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify -pl mekano-rest -am

  docker:
    name: Build and publish image
    needs: [build-test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compute GHCR image name
        id: image
        shell: bash
        run: |
          REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mekano-api"
          echo "image=${REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repository=${REPOSITORY}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: mekano-rest/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
