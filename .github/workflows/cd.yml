name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

concurrency:
  group: mekano-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'mekano-eks' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  DB_USER: ${{ vars.DB_USER || 'mekano' }}

jobs:
  build-test:
    name: Build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify -pl mekano-rest -am

  docker:
    name: Build and publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute GHCR image name
        id: image
        shell: bash
        run: |
          REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mekano-api"
          echo "image=${REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repository=${REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mekano-rest/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Bootstrap backend: creates S3 bucket + DynamoDB lock (only applies on main).
  # On PRs this job will be a fast no-op but will still export outputs (empty strings),
  # avoiding blocking the rest of the CI which needs to reference ${{ needs.bootstrap-backend.outputs.* }}
  bootstrap-backend:
    name: Bootstrap Terraform backend (S3 + DynamoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/bootstrap
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Decide whether to run bootstrap (only apply on main)
        id: decide
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Not on main; skipping bootstrap apply."
            echo "state_bucket=" >> "$GITHUB_OUTPUT"
            echo "lock_table=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "On main; proceeding with bootstrap."

      - name: Terraform init
        if: steps.decide.outcome == 'success' && startsWith(github.ref, 'refs/heads/main')
        run: terraform init

      - name: Terraform apply (bootstrap)
        if: steps.decide.outcome == 'success' && startsWith(github.ref, 'refs/heads/main')
        run: terraform apply -auto-approve

      - name: Export bootstrap outputs
        if: steps.decide.outcome == 'success' && startsWith(github.ref, 'refs/heads/main')
        id: outputs
        run: |
          echo "state_bucket=$(terraform output -raw state_bucket)" >> $GITHUB_OUTPUT
          echo "lock_table=$(terraform output -raw lock_table)" >> $GITHUB_OUTPUT

  infrastructure:
    name: Terraform EKS and RDS (plan)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [build-test, bootstrap-backend]
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_cluster_name: ${{ vars.EKS_CLUSTER_NAME || 'mekano-eks' }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ vars.DB_USER || 'mekano' }}
      TF_VAR_github_actions_principal_arn: ${{ vars.GITHUB_ACTIONS_PRINCIPAL_ARN }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (choose backend bucket from bootstrap or repo variable)
        run: |
          # Prefer bootstrap output (set by bootstrap-backend when running on main). Fallback to repo variable TF_STATE_BUCKET.
          BOOTSTRAP_BUCKET="${{ needs.bootstrap-backend.outputs.state_bucket }}"
          if [ -n "$BOOTSTRAP_BUCKET" ]; then
            echo "Using bootstrap bucket: $BOOTSTRAP_BUCKET"
            terraform init -backend-config="bucket=$BOOTSTRAP_BUCKET" -backend-config="region=$AWS_REGION"
          else
            test -n "$TF_STATE_BUCKET" || (echo "Repository variable TF_STATE_BUCKET is required or run bootstrap on main" && exit 1)
            echo "Using repository TF_STATE_BUCKET: $TF_STATE_BUCKET"
            terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
          fi

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Upload terraform plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan

  infra-apply:
    name: Terraform apply (protected)
    # This job will require environment protection in GitHub (environments > production)
    needs: infrastructure
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download terraform plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Terraform apply (use plan)
        run: terraform apply -auto-approve tfplan

  deploy:
    name: Deploy to EKS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker, infra-apply]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.docker.outputs.image }}
      CLUSTER_NAME: ${{ needs.infrastructure.outputs.cluster_name || '' }}
      DB_ENDPOINT: ${{ needs.infrastructure.outputs.db_endpoint || '' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Apply runtime ConfigMap with RDS endpoint
        shell: bash
        run: |
          kubectl create configmap mekano-config \
            --namespace mekano-system \
            --from-literal=QUARKUS_PROFILE=prod \
            --from-literal=DB_URL="jdbc:postgresql://${DB_ENDPOINT}:5432/mekano" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply runtime Secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-secrets
          printf '%s\n' "$JWT_PRIVATE_KEY" > .deploy-secrets/privatekey.pem
          printf '%s\n' "$JWT_PUBLIC_KEY" > .deploy-secrets/publicKey.pem

          kubectl create secret generic mekano-secret \
            --namespace mekano-system \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-file=privatekey.pem=.deploy-secrets/privatekey.pem \
            --from-file=publicKey.pem=.deploy-secrets/publicKey.pem \
            --dry-run=client -o yaml | kubectl apply -f -

          rm -rf .deploy-secrets

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/mekano mekano="$IMAGE" -n mekano-system

      - name: Wait for rollout and rollback on failure
        shell: bash
        run: |
          set +e
          kubectl rollout status deployment/mekano -n mekano-system --timeout=240s
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "Deployment failed. Rolling back..."
            kubectl rollout undo deployment/mekano -n mekano-system || true
            kubectl rollout status deployment/mekano -n mekano-system --timeout=180s || true
            exit "$STATUS"
          fi

      - name: Verify deployment
        run: |
          kubectl get deployment,pods,svc,hpa -n mekano-system
