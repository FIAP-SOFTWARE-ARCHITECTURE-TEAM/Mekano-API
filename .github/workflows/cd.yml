name: CI-CD
on:
  push:
    branches: [main, feature/ci-cd-terraform]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  # Never cancel a Terraform apply/destroy in the middle.
  group: mekano-terraform
  cancel-in-progress: false
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'mekano-eks' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  DB_USER: ${{ vars.DB_USER || 'mekano' }}
jobs:
  # Reads terraform/.infra-action.
  # Accepted values:
  #   apply   -> provision/update infrastructure
  #   destroy -> destroy the main Terraform stack
  infra-action:
    name: Resolve infrastructure action
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-cd-terraform')
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.action.outputs.action }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read terraform/.infra-action
        id: action
        shell: bash
        run: |
          set -euo pipefail
          test -f terraform/.infra-action || (echo "terraform/.infra-action not found. Use 'apply' or 'destroy'." && exit 1)
          ACTION="$(tr -d '[:space:]' < terraform/.infra-action)"
          case "$ACTION" in
            apply|destroy)
              ;;
            *)
              echo "Invalid infrastructure action: '$ACTION'"
              echo "terraform/.infra-action must contain only: apply or destroy"
              exit 1
              ;;
          esac
          echo "Infrastructure action: $ACTION"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
  build-test:
    name: Build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify -pl mekano-rest -am
  docker:
    name: Build and publish image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-cd-terraform') && needs.infra-action.outputs.action == 'apply'
    needs: [build-test, infra-action]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compute GHCR image name
        id: image
        shell: bash
        run: |
          REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mekano-api"
          echo "image=${REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repository=${REPOSITORY}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: mekano-rest/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # Terraform backend already exists. Validate S3 + DynamoDB before running the main Terraform stack.
  bootstrap-backend:
    name: Verify Terraform backend (S3 + DynamoDB)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-cd-terraform')
    runs-on: ubuntu-latest
    outputs:
      state_bucket: ${{ steps.outputs.outputs.state_bucket }}
      lock_table: ${{ steps.outputs.outputs.lock_table }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Verify Terraform backend
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET" || (echo "Repository variable TF_STATE_BUCKET is required" && exit 1)
          echo "Checking S3 bucket: $TF_STATE_BUCKET"
          aws s3api head-bucket \
            --bucket "$TF_STATE_BUCKET"
          echo "Checking DynamoDB table: mekano-terraform-locks"
          aws dynamodb describe-table \
            --table-name mekano-terraform-locks \
            --region "$AWS_REGION" \
            --query 'Table.TableStatus' \
            --output text
          echo "Terraform backend is ready."
      - name: Export bootstrap outputs
        id: outputs
        shell: bash
        run: |
          echo "state_bucket=$TF_STATE_BUCKET" >> "$GITHUB_OUTPUT"
          echo "lock_table=mekano-terraform-locks" >> "$GITHUB_OUTPUT"
  infrastructure:
    name: Terraform EKS and RDS (plan)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-cd-terraform')
    needs: [bootstrap-backend, infra-action]
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_cluster_name: ${{ vars.EKS_CLUSTER_NAME || 'mekano-eks' }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ vars.DB_USER || 'mekano' }}
      TF_VAR_evolution_db_password: ${{ secrets.EVOLUTION_DB_PASSWORD }}
      TF_VAR_github_actions_principal_arn: ${{ vars.EKS_ACCESS_PRINCIPAL_ARN }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init (choose backend bucket from bootstrap or repo variable)
        run: |
          # Prefer bootstrap output (set by bootstrap-backend when running on main). Fallback to repo variable TF_STATE_BUCKET.
          BOOTSTRAP_BUCKET="${{ needs.bootstrap-backend.outputs.state_bucket }}"
          if [ -n "$BOOTSTRAP_BUCKET" ]; then
            echo "Using bootstrap bucket: $BOOTSTRAP_BUCKET"
            terraform init -backend-config="bucket=$BOOTSTRAP_BUCKET" -backend-config="region=$AWS_REGION"
          else
            test -n "$TF_STATE_BUCKET" || (echo "Repository variable TF_STATE_BUCKET is required or run bootstrap on main" && exit 1)
            echo "Using repository TF_STATE_BUCKET: $TF_STATE_BUCKET"
            terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
          fi
      - name: Terraform validate
        run: terraform validate
      - name: Guard temporary imports on fresh provisioning
        shell: bash
        run: |
          set -euo pipefail
          ACTION="${{ needs.infra-action.outputs.action }}"
          if [ "$ACTION" != "apply" ]; then
            exit 0
          fi
          # import blocks are only for reconciling resources that already exist.
          # After a full destroy, active EKS imports must be removed before a fresh apply.
          if ! aws eks describe-cluster             --name "$TF_VAR_cluster_name"             --region "$AWS_REGION" >/dev/null 2>&1; then
            if [ -f imports.tf ] && grep -Eq '^[[:space:]]*import[[:space:]]*\{' imports.tf; then
              echo "::error::Fresh provisioning detected, but terraform/imports.tf still contains active import blocks."
              echo "::error::Remove the temporary import blocks, commit the change, and push again."
              exit 1
            fi
          fi
      - name: Terraform plan
        # Validation-only plan. The protected job below creates the saved plan.
        shell: bash
        run: |
          set -euo pipefail
          ACTION="${{ needs.infra-action.outputs.action }}"
          if [ "$ACTION" = "destroy" ]; then
            echo "Planning Terraform DESTROY..."
            terraform plan -destroy -input=false -no-color
          else
            echo "Planning Terraform APPLY..."
            terraform plan -input=false -no-color
          fi
  infra-apply:
    name: Terraform apply/destroy (protected)
    # Configure the "production" environment in GitHub with required reviewers
    # if you want manual approval before changing AWS infrastructure.
    needs: [infrastructure, infra-action, build-test]
    runs-on: ubuntu-latest
    environment: production
    # Apply requires successful build/tests. Destroy is allowed even if application tests fail.
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-cd-terraform') && needs.infrastructure.result == 'success' && needs.infra-action.result == 'success' && (needs.infra-action.outputs.action == 'destroy' || needs.build-test.result == 'success')
    outputs:
      cluster_name: ${{ steps.tfout.outputs.cluster_name }}
      db_endpoint: ${{ steps.tfout.outputs.db_endpoint }}
      evolution_db_endpoint: ${{ steps.tfout.outputs.evolution_db_endpoint }}
      evolution_redis_endpoint: ${{ steps.tfout.outputs.evolution_redis_endpoint }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_cluster_name: ${{ vars.EKS_CLUSTER_NAME || 'mekano-eks' }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_username: ${{ vars.DB_USER || 'mekano' }}
      TF_VAR_evolution_db_password: ${{ secrets.EVOLUTION_DB_PASSWORD }}
      TF_VAR_github_actions_principal_arn: ${{ vars.EKS_ACCESS_PRINCIPAL_ARN }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Terraform init
        run: |
          test -n "$TF_STATE_BUCKET" || (echo "Repository variable TF_STATE_BUCKET is required" && exit 1)
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"
      - name: Terraform validate
        run: terraform validate
      - name: Set up kubectl for destroy
        if: needs.infra-action.outputs.action == 'destroy'
        uses: azure/setup-kubectl@v5
      - name: Set up Helm for destroy
        if: needs.infra-action.outputs.action == 'destroy'
        uses: azure/setup-helm@v5
        with:
          version: 'v3.21.0'
      - name: Cleanup Kubernetes resources before Terraform destroy
        if: needs.infra-action.outputs.action == 'destroy'
        shell: bash
        run: |
          set -euo pipefail
          if ! aws eks describe-cluster             --name "$TF_VAR_cluster_name"             --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "EKS cluster does not exist. Skipping Kubernetes cleanup."
            exit 0
          fi
          VPC_ID="$(aws eks describe-cluster             --name "$TF_VAR_cluster_name"             --region "$AWS_REGION"             --query 'cluster.resourcesVpcConfig.vpcId'             --output text)"
          echo "Cluster VPC: $VPC_ID"
          aws eks update-kubeconfig             --region "$AWS_REGION"             --name "$TF_VAR_cluster_name"
          # The ingress-nginx LoadBalancer is created by Kubernetes/Helm, not by Terraform.
          # Remove it before Terraform destroys the VPC.
          helm uninstall ingress-nginx             --namespace ingress-nginx             --wait             --timeout 5m || true
          # Remove workloads/PVCs while EKS nodes and the EBS CSI driver still exist.
          kubectl delete namespace mekano-system             --ignore-not-found=true             --wait=true             --timeout=5m || true
          kubectl delete namespace ingress-nginx             --ignore-not-found=true             --wait=true             --timeout=5m || true
          echo "Waiting for AWS Load Balancers in VPC $VPC_ID to be deleted..."
          for ATTEMPT in $(seq 1 40); do
            CLASSIC_VPCS="$(aws elb describe-load-balancers               --region "$AWS_REGION"               --query 'LoadBalancerDescriptions[].VPCId'               --output text 2>/dev/null || true)"
            V2_VPCS="$(aws elbv2 describe-load-balancers               --region "$AWS_REGION"               --query 'LoadBalancers[].VpcId'               --output text 2>/dev/null || true)"
            CLASSIC_COUNT="$(printf '%s\n' "$CLASSIC_VPCS" | tr '\t' '\n' | grep -cx "$VPC_ID" || true)"
            V2_COUNT="$(printf '%s\n' "$V2_VPCS" | tr '\t' '\n' | grep -cx "$VPC_ID" || true)"
            echo "Attempt $ATTEMPT/40 - classic=$CLASSIC_COUNT elbv2=$V2_COUNT"
            if [ "$CLASSIC_COUNT" -eq 0 ] && [ "$V2_COUNT" -eq 0 ]; then
              echo "No Load Balancers remain in the Terraform VPC."
              break
            fi
            if [ "$ATTEMPT" -eq 40 ]; then
              echo "::error::Load Balancer cleanup timed out. Terraform destroy was stopped to avoid VPC DependencyViolation."
              aws elb describe-load-balancers                 --region "$AWS_REGION"                 --query 'LoadBalancerDescriptions[].{Name:LoadBalancerName,VPC:VPCId,DNS:DNSName}'                 --output table || true
              aws elbv2 describe-load-balancers                 --region "$AWS_REGION"                 --query 'LoadBalancers[].{Name:LoadBalancerName,VPC:VpcId,DNS:DNSName}'                 --output table || true
              exit 1
            fi
            sleep 15
          done
      - name: Terraform plan for execution
        # Create the saved plan only inside this protected runner.
        # It is not uploaded as an artifact because it may contain sensitive values.
        shell: bash
        run: |
          set -euo pipefail
          ACTION="${{ needs.infra-action.outputs.action }}"
          if [ "$ACTION" = "destroy" ]; then
            echo "Creating Terraform DESTROY plan..."
            terraform plan -destroy -input=false -out=tfplan
          else
            echo "Creating Terraform APPLY plan..."
            terraform plan -input=false -out=tfplan
          fi
      - name: Terraform execute saved plan
        run: terraform apply -input=false -auto-approve tfplan
      - name: Export Terraform outputs
        if: needs.infra-action.outputs.action == 'apply'
        id: tfout
        shell: bash
        run: |
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "db_endpoint=$(terraform output -raw db_endpoint)" >> "$GITHUB_OUTPUT"
          echo "evolution_db_endpoint=$(terraform output -raw evolution_db_endpoint)" >> "$GITHUB_OUTPUT"
          echo "evolution_redis_endpoint=$(terraform output -raw evolution_redis_endpoint)" >> "$GITHUB_OUTPUT"
  deploy:
    name: Deploy to EKS
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-cd-terraform') && needs.infra-action.outputs.action == 'apply'
    needs: [docker, infra-apply, infra-action]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.docker.outputs.image }}
      CLUSTER_NAME: ${{ needs.infra-apply.outputs.cluster_name }}
      DB_ENDPOINT: ${{ needs.infra-apply.outputs.db_endpoint }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      EVOLUTION_DB_ENDPOINT: ${{ needs.infra-apply.outputs.evolution_db_endpoint }}
      EVOLUTION_REDIS_ENDPOINT: ${{ needs.infra-apply.outputs.evolution_redis_endpoint }}
      EVOLUTION_DB_PASSWORD: ${{ secrets.EVOLUTION_DB_PASSWORD }}
      EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
      EVOLUTION_WEBHOOK_TOKEN: ${{ secrets.EVOLUTION_WEBHOOK_TOKEN }}
      EVOLUTION_INSTANCE_NAME: ${{ vars.EVOLUTION_INSTANCE_NAME || 'mekano' }}
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.21.0'
      - name: Install or upgrade NGINX Ingress Controller
        shell: bash
        run: |
          set -euo pipefail
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --set controller.service.type=LoadBalancer \
            --wait \
            --timeout 5m
          kubectl get ingressclass nginx
          kubectl get deployment,svc -n ingress-nginx
      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml
      - name: Configure GHCR image pull secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GHCR_USERNAME" || (echo "GHCR_USERNAME secret is required" && exit 1)
          test -n "$GHCR_TOKEN" || (echo "GHCR_TOKEN secret is required" && exit 1)
          kubectl create secret docker-registry ghcr-secret \
            --namespace mekano-system \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client \
            -o yaml | kubectl apply -f -
      - name: Apply runtime ConfigMap with RDS endpoint
        shell: bash
        run: |
          kubectl create configmap mekano-config \
            --namespace mekano-system \
            --from-literal=QUARKUS_PROFILE=prod \
            --from-literal=DB_URL="jdbc:postgresql://${DB_ENDPOINT}:5432/mekano" \
            --from-literal=EVOLUTION_API_URL="http://evolution-api:5033" \
            --from-literal=EVOLUTION_INSTANCE_NAME="$EVOLUTION_INSTANCE_NAME" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply runtime Secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-secrets
          printf '%s\n' "$JWT_PRIVATE_KEY" > .deploy-secrets/privatekey.pem
          printf '%s\n' "$JWT_PUBLIC_KEY" > .deploy-secrets/publicKey.pem
          kubectl create secret generic mekano-secret \
            --namespace mekano-system \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=EVOLUTION_API_KEY="$EVOLUTION_API_KEY" \
            --from-literal=EVOLUTION_WEBHOOK_TOKEN="$EVOLUTION_WEBHOOK_TOKEN" \
            --from-file=privatekey.pem=.deploy-secrets/privatekey.pem \
            --from-file=publicKey.pem=.deploy-secrets/publicKey.pem \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -rf .deploy-secrets
      - name: Apply Evolution API runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVOLUTION_DB_ENDPOINT" || (echo "EVOLUTION_DB_ENDPOINT is required" && exit 1)
          test -n "$EVOLUTION_REDIS_ENDPOINT" || (echo "EVOLUTION_REDIS_ENDPOINT is required" && exit 1)
          test -n "$EVOLUTION_DB_PASSWORD" || (echo "EVOLUTION_DB_PASSWORD secret is required" && exit 1)
          test -n "$EVOLUTION_API_KEY" || (echo "EVOLUTION_API_KEY secret is required" && exit 1)
          test -n "$EVOLUTION_WEBHOOK_TOKEN" || (echo "EVOLUTION_WEBHOOK_TOKEN secret is required" && exit 1)
          ENCODED_EVOLUTION_DB_PASSWORD="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["EVOLUTION_DB_PASSWORD"], safe=""))')"
          EVOLUTION_DATABASE_URI="postgresql://evolution:${ENCODED_EVOLUTION_DB_PASSWORD}@${EVOLUTION_DB_ENDPOINT}:5432/evolution?schema=public"
          kubectl create configmap evolution-config \
            --namespace mekano-system \
            --from-literal=SERVER_URL="http://evolution-api:5033" \
            --from-literal=SERVER_PORT="5033" \
            --from-literal=DATABASE_PROVIDER="postgresql" \
            --from-literal=DATABASE_SAVE_DATA_INSTANCE="true" \
            --from-literal=DATABASE_SAVE_DATA_NEW_MESSAGE="true" \
            --from-literal=DATABASE_SAVE_MESSAGE_UPDATE="true" \
            --from-literal=DATABASE_SAVE_DATA_CONTACTS="true" \
            --from-literal=DATABASE_SAVE_DATA_CHATS="true" \
            --from-literal=CACHE_REDIS_ENABLED="true" \
            --from-literal=CACHE_REDIS_URI="redis://${EVOLUTION_REDIS_ENDPOINT}:6379" \
            --from-literal=CACHE_REDIS_PREFIX_KEY="mekano" \
            --from-literal=CACHE_REDIS_SAVE_INSTANCES="false" \
            --from-literal=CACHE_LOCAL_ENABLED="false" \
            --from-literal=WEBHOOK_GLOBAL_ENABLED="true" \
            --from-literal=WEBHOOK_GLOBAL_URL="http://mekano:8080/api/v1/webhooks/evolution" \
            --from-literal=WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS="false" \
            --from-literal=WEBHOOK_EVENTS_MESSAGES_UPSERT="true" \
            --from-literal=AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES="false" \
            --from-literal=LANGUAGE="pt-BR" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic evolution-secret \
            --namespace mekano-system \
            --from-literal=AUTHENTICATION_API_KEY="$EVOLUTION_API_KEY" \
            --from-literal=DATABASE_CONNECTION_URI="$EVOLUTION_DATABASE_URI" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f k8s/evolution.yaml
          echo "Waiting for Evolution API..."
          kubectl rollout status deployment/evolution-api \
            -n mekano-system \
            --timeout=600s
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml
          echo "Applying Mekano Deployment with image: $IMAGE"
          sed "s|__MEKANO_IMAGE__|${IMAGE}|g" \
            k8s/deployment.yaml | kubectl apply -f -
      - name: Wait for rollout and rollback on failure
        shell: bash
        run: |
          set +e
          kubectl rollout status deployment/mekano \
            -n mekano-system \
            --timeout=240s
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "======================================"
            echo "DEPLOYMENT"
            echo "======================================"
            kubectl describe deployment mekano -n mekano-system || true
            echo "======================================"
            echo "PODS"
            echo "======================================"
            kubectl get pods -n mekano-system -o wide || true
            echo "======================================"
            echo "POD DESCRIBE"
            echo "======================================"
            for POD in $(kubectl get pods \
              -n mekano-system \
              -l app=mekano \
              -o name); do
              echo "### $POD"
              kubectl describe "$POD" -n mekano-system || true
            done
            echo "======================================"
            echo "CONTAINER LOGS"
            echo "======================================"
            for POD in $(kubectl get pods \
              -n mekano-system \
              -l app=mekano \
              -o name); do
              echo "### $POD"
              kubectl logs "$POD" \
                -n mekano-system \
                --all-containers=true \
                --tail=200 || true
              echo "### Previous container"
              kubectl logs "$POD" \
                -n mekano-system \
                --all-containers=true \
                --previous \
                --tail=200 || true
            done
            echo "======================================"
            echo "EVENTS"
            echo "======================================"
            kubectl get events \
              -n mekano-system \
              --sort-by='.lastTimestamp' || true
            echo "Deployment failed. Rolling back..."
            kubectl rollout undo deployment/mekano \
              -n mekano-system || true
            kubectl rollout status deployment/mekano \
              -n mekano-system \
              --timeout=180s || true
            exit "$STATUS"
          fi
          set -e
      - name: Verify deployment
        run: |
          kubectl get deployment,pods,svc,hpa,ingress,pvc -n mekano-system
          kubectl get service ingress-nginx-controller -n ingress-nginx
