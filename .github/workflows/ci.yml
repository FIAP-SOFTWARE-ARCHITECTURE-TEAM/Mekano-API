name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/ci-cd-terraform

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Configure Maven Wrapper permission
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B -ntp verify -pl mekano-rest -am