# =============================================================================
# mekano-infrastructure — Test Configuration (H2 in-memory)
# =============================================================================
# Schema gerado pelo Hibernate (drop-and-create) das entidades JPA.
# Flyway não roda em testes — zero necessidade de adaptar migrations.

quarkus.config.locations=cache-config.yml
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:mekano;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
