quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:mekano;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa

quarkus.flyway.migrate-at-start=false
quarkus.hibernate-orm.database.generation=drop-and-create

# JaCoCo — escrever no mesmo local que Maven JaCoCo espera
quarkus.jacoco.data-file=target/jacoco.exec

mekano.public-url=https://test.example.com
