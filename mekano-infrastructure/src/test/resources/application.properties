# =============================================================================
# mekano-infrastructure — Test Configuration
# =============================================================================
# Este arquivo existe porque mekano-adapter/src/main/resources/application.properties
# NÃO está no classpath quando ./mvnw test -pl mekano-infrastructure -am executa.
# Cada módulo deve ser autossuficiente para seus próprios @QuarkusTest. (D-05)

# Tipo do banco — necessário para DevServices saber qual container subir
quarkus.datasource.db-kind=postgresql

# CRÍTICO: ausência de quarkus.datasource.jdbc.url → DevServices ativa automaticamente
# Quarkus sobe PostgreSQL via Testcontainers (Docker) sem configuração adicional.
# NÃO adicionar quarkus.datasource.jdbc.url aqui.

# Flyway: migrar automaticamente ao subir o contexto de teste (INF-05)
quarkus.flyway.migrate-at-start=true

# Hibernate: validar que o schema criado pelo Flyway corresponde ao mapeamento JPA
# Se UserEntity tiver campo sem coluna correspondente → startup falha imediatamente
quarkus.hibernate-orm.schema-management.strategy=validate

# Perfil test: limpa o schema antes de cada test run para garantir idempotência
%test.quarkus.flyway.clean-at-start=true

# Perfil test: imagem PostgreSQL específica para reproducibilidade
%test.quarkus.datasource.devservices.image-name=docker.io/library/postgres:16-alpine

# Issuer para tokens de refresh (não precisa ser o mesmo do access token)
mp.jwt.verify.issuer=https://mekano.fiap.com.br/refresh
