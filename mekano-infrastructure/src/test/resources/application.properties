# Testes de integracao do modulo infrastructure: PostgreSQL via DevServices/Testcontainers
# (paridade de dialeto com prod — ver tb datasource-config.yml perfil %test no mekano-rest).
# Requer Docker rodando na maquina.

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:16-alpine

quarkus.flyway.migrate-at-start=false
quarkus.flyway.repair-at-start=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.jacoco.data-file=target/jacoco.exec

mekano.public-url=https://test.example.com
