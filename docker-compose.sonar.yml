services:
  postgres:
    image: postgres:16
    container_name: mekano-postgres
    environment:
      POSTGRES_DB: mekano
      POSTGRES_USER: mekano
      POSTGRES_PASSWORD: mekano
    ports:
      - "5432:5432"
    volumes:
      - mekano_postgres_data:/var/lib/postgresql/data
    networks:
      - mekano-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mekano -d mekano"]
      interval: 10s
      timeout: 5s
      retries: 10

  mekano-api:
    image: maven:3.9-eclipse-temurin-17
    container_name: mekano-api
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/mekano
      QUARKUS_DATASOURCE_USERNAME: mekano
      QUARKUS_DATASOURCE_PASSWORD: mekano
    networks:
      - mekano-net
    entrypoint:
      - /bin/sh
      - -ec
      - |
        echo "Validando estrutura do projeto..."
        pwd
        ls -la

        if [ ! -f "pom.xml" ]; then
          echo "ERRO: pom.xml não encontrado em /workspace."
          echo "Coloque o docker-compose.yml na raiz do repositório Mekano-API."
          exit 1
        fi

        if [ ! -f "mekano-rest/pom.xml" ]; then
          echo "ERRO: mekano-rest/pom.xml não encontrado."
          echo "Verifique se o compose está na raiz do projeto e se o módulo mekano-rest existe."
          echo "Módulos encontrados:"
          find . -maxdepth 2 -name pom.xml -print
          exit 1
        fi

        echo "Instalando módulos Maven no cache local..."
        mvn -B -ntp -DskipTests clean install

        echo "Subindo Mekano API em modo dev..."
        mvn -B -ntp -f mekano-rest/pom.xml quarkus:dev \
          -Dquarkus.http.host=0.0.0.0 \
          -Dquarkus.http.port=8080

  sonar-db:
    image: postgres:16-alpine
    container_name: mekano-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    networks:
      - mekano-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    container_name: mekano-sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar

      # Apenas para ambiente local/testes.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"

      SONAR_WEB_JAVAOPTS: "-Xmx512m -Xms128m"
      SONAR_CE_JAVAOPTS: "-Xmx512m -Xms128m"
      SONAR_SEARCH_JAVAOPTS: "-Xmx512m -Xms512m"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonar_tokens:/tokens
    networks:
      - mekano-net
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc:
        soft: 8192
        hard: 8192

  sonar-init:
    image: curlimages/curl:8.10.1
    container_name: mekano-sonar-init
    user: "0:0"
    depends_on:
      - sonarqube
    env_file:
      - .env.sonar
    volumes:
      - sonar_tokens:/tokens
      - .:/workspace
    networks:
      - mekano-net
    entrypoint:
      - /bin/sh
      - -ec
      - |
        echo "Aguardando SonarQube ficar UP..."

        until curl -s http://sonarqube:9000/api/system/status | grep -q '"status":"UP"'; do
          sleep 5
        done

        echo "SonarQube está UP."

        echo "Testando autenticação com senha nova..."

        if curl -s -u "$${SONAR_ADMIN_USER}:$${SONAR_NEW_PASSWORD}" \
          "http://sonarqube:9000/api/authentication/validate" | grep -q '"valid":true'; then
          echo "Senha nova já está válida."
          AUTH_PASSWORD="$${SONAR_NEW_PASSWORD}"
        else
          echo "Testando autenticação com senha inicial..."

          if curl -s -u "$${SONAR_ADMIN_USER}:$${SONAR_ADMIN_PASSWORD}" \
            "http://sonarqube:9000/api/authentication/validate" | grep -q '"valid":true'; then

            echo "Senha inicial válida. Alterando senha..."

            CHANGE_RESPONSE=$$(curl -s -u "$${SONAR_ADMIN_USER}:$${SONAR_ADMIN_PASSWORD}" \
              -X POST "http://sonarqube:9000/api/users/change_password" \
              -d "login=$${SONAR_ADMIN_USER}" \
              -d "previousPassword=$${SONAR_ADMIN_PASSWORD}" \
              -d "password=$${SONAR_NEW_PASSWORD}")

            echo "Resposta alteração senha: $$CHANGE_RESPONSE"

            if curl -s -u "$${SONAR_ADMIN_USER}:$${SONAR_NEW_PASSWORD}" \
              "http://sonarqube:9000/api/authentication/validate" | grep -q '"valid":true'; then
              echo "Senha alterada com sucesso."
              AUTH_PASSWORD="$${SONAR_NEW_PASSWORD}"
            else
              echo "ERRO: senha não foi alterada."
              exit 1
            fi
          else
            echo "ERRO: não autenticou com senha nova nem com senha inicial."
            echo "Provável causa: volume antigo do Sonar com outra senha."
            echo "Solução: rode docker compose down -v e suba novamente."
            exit 1
          fi
        fi

        echo "Criando projeto no SonarQube, se não existir..."

        CREATE_RESPONSE=$$(curl -s -u "$${SONAR_ADMIN_USER}:$${AUTH_PASSWORD}" \
          -X POST "http://sonarqube:9000/api/projects/create" \
          -d "project=$${SONAR_PROJECT_KEY}" \
          -d "name=$${SONAR_PROJECT_NAME}" || true)

        echo "Resposta criação projeto: $$CREATE_RESPONSE"

        echo "Revogando token antigo, se existir..."

        REVOKE_RESPONSE=$$(curl -s -u "$${SONAR_ADMIN_USER}:$${AUTH_PASSWORD}" \
          -X POST "http://sonarqube:9000/api/user_tokens/revoke" \
          -d "name=$${SONAR_TOKEN_NAME}" || true)

        echo "Resposta revoke token: $$REVOKE_RESPONSE"

        echo "Gerando token comum..."

        TOKEN_RESPONSE=$$(curl -s -u "$${SONAR_ADMIN_USER}:$${AUTH_PASSWORD}" \
          -X POST "http://sonarqube:9000/api/user_tokens/generate" \
          -d "name=$${SONAR_TOKEN_NAME}")

        TOKEN=$$(echo "$$TOKEN_RESPONSE" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')

        if [ -z "$$TOKEN" ]; then
          echo "ERRO: não foi possível extrair o token."
          echo "Resposta recebida:"
          echo "$$TOKEN_RESPONSE"
          exit 1
        fi

        echo "Token gerado com sucesso."

        mkdir -p /tokens
        echo "$$TOKEN" > /tokens/sonar.token
        chmod 600 /tokens/sonar.token

        mkdir -p /workspace/.mvn

        {
          echo "-Dsonar.host.url=http://localhost:9000"
          echo "-Dsonar.projectKey=$${SONAR_PROJECT_KEY}"
          echo "-Dsonar.projectName=$${SONAR_PROJECT_NAME}"
          echo "-Dsonar.token=$$TOKEN"
          echo "-Dsonar.maven.scanAll=true"
        } > /workspace/.mvn/sonar-local.config

        echo "SonarQube configurado com projeto e token."
        echo "Token salvo em /tokens/sonar.token"
        echo "Arquivo local criado em .mvn/sonar-local.config"

  sonar-scan:
    image: maven:3.9-eclipse-temurin-17
    container_name: mekano-sonar-scan
    depends_on:
      sonar-init:
        condition: service_completed_successfully
    working_dir: /workspace
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
      - sonar_tokens:/tokens
    networks:
      - mekano-net
    env_file:
      - .env.sonar
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ ! -f "pom.xml" ]; then
          echo "ERRO: pom.xml não encontrado em /workspace."
          echo "Coloque o docker-compose.yml na raiz do repositório Mekano-API."
          exit 1
        fi

        SONAR_TOKEN=$$(cat /tokens/sonar.token)

        echo "Executando build Maven..."
        mvn -B -ntp clean install

        echo "Enviando análise para o SonarQube..."
        mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.host.url=http://sonarqube:9000 \
          -Dsonar.token=$$SONAR_TOKEN \
          -Dsonar.projectKey=$${SONAR_PROJECT_KEY} \
          -Dsonar.projectName="$${SONAR_PROJECT_NAME}"
    profiles:
      - sonar

  sonar-report:
    image: python:3.12-slim
    container_name: mekano-sonar-report
    depends_on:
      - sonarqube
    working_dir: /workspace
    volumes:
      - .:/workspace
      - sonar_tokens:/tokens
    networks:
      - mekano-net
    env_file:
      - .env.sonar
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
    entrypoint:
      - /bin/sh
      - -ec
      - |
        pip install --no-cache-dir requests reportlab

        mkdir -p reports

        if [ -f /tokens/sonar.token ]; then
          export SONAR_TOKEN=$$(cat /tokens/sonar.token)
        fi

        if [ ! -f tools/sonar-report/generate_sonar_report.py ]; then
          echo "ERRO: script tools/sonar-report/generate_sonar_report.py não encontrado."
          echo "Crie o script de geração de relatório antes de executar este serviço."
          exit 1
        fi

        python tools/sonar-report/generate_sonar_report.py
    profiles:
      - report

volumes:
  mekano_postgres_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonarqube_db:
  sonar_tokens:
  maven_cache:

networks:
  mekano-net:
    driver: bridge