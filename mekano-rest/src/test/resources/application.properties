# Testes REST: PostgreSQL via DevServices/Testcontainers (paridade com prod).
# Requer Docker rodando. Ver tambem datasource-config.yml perfil %test.
# NOTA: este arquivo SUBSTITUI o application.properties de main como config
# source "application.properties" — as propriedades de main precisam ser
# replicadas aqui (index-dependency, jacoco).

# Indexacao CDI dos modulos dependentes (mesmo conteudo do main)
quarkus.index-dependency.mekano-app.group-id=com.fiap
quarkus.index-dependency.mekano-app.artifact-id=mekano-application
quarkus.index-dependency.mekano-infra.group-id=com.fiap
quarkus.index-dependency.mekano-infra.artifact-id=mekano-infrastructure

# PostgreSQL via Testcontainers em vez de H2
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:16-alpine

quarkus.flyway.migrate-at-start=false
quarkus.flyway.repair-at-start=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# JaCoCo �?" escrever no mesmo local que Maven JaCoCo espera
quarkus.jacoco.data-file=target/jacoco.exec
