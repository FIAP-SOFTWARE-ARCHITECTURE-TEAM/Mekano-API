# --- Datasource, Hibernate, Flyway ---
# Credenciais via ${VAR:default}: resolvem de (1) System props, (2) env vars reais,
# (3) .env na raiz do projeto, ou (4) o default abaixo. Nunca quebra se ausentes.
# Em prod use variáveis de ambiente reais (DB_USER/DB_PASSWORD/DB_URL).
quarkus:
  datasource:
    db-kind: postgresql
    username: ${DB_USER:mekano}
    password: ${DB_PASSWORD:mekano}
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/mekano}
  flyway:
    migrate-at-start: true
    connect-retries: 5
  hibernate-orm:
    schema-management:
      strategy: validate

"%dev":
  quarkus:
    hibernate-orm:
      log:
        sql: true

"%prod":
  quarkus:
    hibernate-orm:
      log:
        sql: false

"%test":
  quarkus:
    datasource:
      db-kind: h2
      jdbc:
        url: jdbc:h2:mem:mekano;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    flyway:
      migrate-at-start: false
    hibernate-orm:
      database:
        generation: drop-and-create
