# --- Datasource, Hibernate, Flyway ---
# Credenciais via ${VAR:default}: resolvem de (1) System props, (2) env vars reais,
# (3) .env na raiz do projeto, ou (4) o default abaixo. Nunca quebra se ausentes.
#
# jdbc.url é POR PERFIL — nunca na base:
#   %dev  → compose local (DB_URL sobrepõe)
#   %prod → RDS/EKS via DB_URL (compose define QUARKUS_PROFILE=prod)
#   %test → SEM url: DevServices sobe PostgreSQL via Testcontainers
# Base sem url é o que permite o DevServices injetar a URL do container.
quarkus:
  datasource:
    db-kind: postgresql
    username: ${DB_USER:mekano}
    password: ${DB_PASSWORD:mekano}
  flyway:
    migrate-at-start: false
    repair-at-start: false
    out-of-order: true
    connect-retries: 5
  hibernate-orm:
    schema-management:
      strategy: validate

"%dev":
  quarkus:
    datasource:
      jdbc:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/mekano}
    flyway:
      migrate-at-start: true
      repair-at-start: true
    hibernate-orm:
      log:
        sql: true

"%prod":
  quarkus:
    datasource:
      jdbc:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/mekano}
    flyway:
      migrate-at-start: true
      repair-at-start: true
    hibernate-orm:
      log:
        sql: false

"%test":
  quarkus:
    datasource:
      db-kind: postgresql
      devservices:
        image-name: postgres:16-alpine
    flyway:
      migrate-at-start: false
      repair-at-start: false
    hibernate-orm:
      schema-management:
        strategy: drop-and-create
