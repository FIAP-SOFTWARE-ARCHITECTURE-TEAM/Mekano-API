# Mekano — Application Configuration
# Configurações em YAMLs contextuais (via quarkus.config.locations):
#   datasource-config.yml  — datasource, Flyway, Hibernate (com perfis %dev/%prod/%test)
#   api-config.yml         — REST path, CORS, Jackson timezone
#   openapi-config.yml     — Swagger UI, OpenAPI info
#   logging-config.yml     — JSON logging, log levels (com perfis)
#   cache-config.yml       — Caffeine caches (vindo de mekano-infrastructure)
quarkus.config.locations=datasource-config.yml,api-config.yml,openapi-config.yml,logging-config.yml,cache-config.yml
