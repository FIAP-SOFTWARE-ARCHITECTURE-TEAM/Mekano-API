# =============================================================================
# Mekano — Application Configuration
# =============================================================================

# --- Datasource global ---
quarkus.datasource.db-kind=postgresql

# --- Perfil %dev: aponta para docker-compose (DEV-02) ---
# Iniciar com: docker-compose up -d && ./mvnw quarkus:dev -pl mekano-rest -am
%dev.quarkus.datasource.username=mekano
%dev.quarkus.datasource.password=mekano
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mekano

# --- Perfil %prod: variáveis de ambiente obrigatórias ---
%prod.quarkus.datasource.username=${DB_USER:mekano}
%prod.quarkus.datasource.password=${DB_PASSWORD:mekano}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/mekano}

# --- Perfil %test: conexão com PostgreSQL via Rancher Desktop ---
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mekano
%test.quarkus.datasource.username=mekano
%test.quarkus.datasource.password=mekano

# --- Hibernate ORM ---
%dev.quarkus.hibernate-orm.log.sql=true
%prod.quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.hibernate-orm.schema-management.strategy=validate

# --- Flyway (Gotcha 4: migrate-at-start=false por padrão — declarar explicitamente) ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.connect-retries=5

# --- OpenAPI / Swagger UI (EXT-04, ADP-07) ---
quarkus.swagger-ui.always-include=true
mp.openapi.info.title=Mekano API
mp.openapi.info.version=1.0.0
mp.openapi.info.description=Clean Architecture REST API — FIAP Software Architecture

# --- Perfil %test: limpa schema antes de cada test run (idempotência em testes de integração) ---
%test.quarkus.flyway.clean-at-start=true

# --- Perfil %test: validar schema JPA em testes (detecta divergência entre UserEntity e migration) ---
%test.quarkus.hibernate-orm.schema-management.strategy=validate

# Test: reuse Postgres devservice container between @QuarkusTest classes
# (mitiga npipe MalformedChunkCodingException ao reiniciar containers em sequência no Windows + Docker 29)
%test.quarkus.datasource.devservices.reuse=true

# --- Prefixo da API REST (D-08) ---
quarkus.rest.path=/api/v1

# --- CORS global (D-07) - runtime config do Vert.x ---
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,info,total-count
quarkus.http.cors.access-control-max-age=24H

# --- Jackson: timezone explícito em timestamps (D-10) ---
quarkus.jackson.timezone=America/Sao_Paulo

# --- Logging JSON estruturado (D-12) ---
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
# Nível de log: INFO em prod, DEBUG em dev
%dev.quarkus.log.level=DEBUG
%prod.quarkus.log.level=INFO
%test.quarkus.log.level=WARN

# --- Cache Caffeine: users (D-13) ---
quarkus.cache.caffeine.users.initial-capacity=10
quarkus.cache.caffeine.users.maximum-size=100
quarkus.cache.caffeine.users.expire-after-write=60s
