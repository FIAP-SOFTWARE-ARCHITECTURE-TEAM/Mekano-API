# --- API prefix, CORS, Jackson timezone ---
quarkus:
  rest:
    path: /api/v1
  http:
    port: 8080
    cors:
      enabled: true
      origins: "*"
      methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      headers: accept,authorization,content-type,x-requested-with
      exposed-headers: location,info,total-count
      access-control-max-age: 24H
  jackson:
    timezone: America/Sao_Paulo
  rest-client:
    evolution-api:
      url: ${EVOLUTION_API_URL:http://localhost:5033}
      connect-timeout: 5000
      read-timeout: 15000

# Evolution API — WhatsApp integration (WPP-01)
evolution:
  api-key: ${EVOLUTION_API_KEY:dev-key}
  instance-name: ${EVOLUTION_INSTANCE_NAME:mekano}
  # CR-02: fail closed — sem EVOLUTION_WEBHOOK_TOKEN o webhook rejeita tudo com 401
  webhook-token: ${EVOLUTION_WEBHOOK_TOKEN:}

# App public URL — usado em links de acompanhamento em mensagens WhatsApp
mekano:
  public-url: ${MEKANO_PUBLIC_URL:https://mekano.app}

"%test":
  evolution:
    webhook-token: test-webhook-token
