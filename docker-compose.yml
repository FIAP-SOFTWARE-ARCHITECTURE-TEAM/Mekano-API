version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mekano-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mekano
      POSTGRES_USER: ${POSTGRES_USER:-mekano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mekano}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mekano} -d mekano"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
