services:
  postgres:
    image: postgres:16-alpine
    container_name: mekano-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mekano
      POSTGRES_USER: ${POSTGRES_USER:-mekano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mekano}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mekano} -d mekano"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mekano-net

  keygen:
    image: alpine:3.20
    container_name: mekano-keygen
    command: >
      sh -c "
        if [ ! -f /secrets/privatekey.pem ]; then
          mkdir -p /secrets &&
          apk add --no-cache openssl &&
          openssl genpkey -algorithm Ed25519 -out /secrets/privatekey.pem &&
          openssl pkey -in /secrets/privatekey.pem -pubout -out /secrets/publicKey.pem &&
          chmod 644 /secrets/privatekey.pem /secrets/publicKey.pem &&
          echo 'Key pair generated'
        else
          echo 'Key pair already exists'
        fi
      "
    volumes:
      - mekano_secrets:/secrets
    restart: no
    networks:
      - mekano-net

  mekano:
    build:
      context: .
      dockerfile: mekano-rest/src/main/docker/Dockerfile.jvm
    container_name: mekano-api
    ports:
      - "8080:8080"
    environment:
      QUARKUS_PROFILE: prod
      DB_URL: jdbc:postgresql://postgres:5432/mekano
      DB_USER: ${POSTGRES_USER:-mekano}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mekano}
      SMALLRYE_JWT_SIGN_KEY_LOCATION: /home/jboss/.mekano/secrets/privatekey.pem
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: /home/jboss/.mekano/secrets/publicKey.pem
      EVOLUTION_API_URL: http://evolution-api:5033
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-dev-key}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-mekano}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:-change_me_webhook_token}
    volumes:
      - mekano_secrets:/home/jboss/.mekano/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/q/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - mekano-net

  # --- Evolution API (WhatsApp gateway) — Issue #77 WPP-01 ---
  evolution-postgres:
    image: postgres:16-alpine
    container_name: mekano-evolution-postgres
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mekano-net

  evolution-redis:
    image: redis:7-alpine
    container_name: mekano-evolution-redis
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mekano-net

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: mekano-evolution-api
    ports:
      - "5033:5033"
    environment:
      SERVER_URL: http://localhost:5033
      SERVER_PORT: "5033"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution}@evolution-postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      REDIS_ENABLED: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      CACHE_REDIS_KEY_PREFIX: mekano
      CACHE_LOCAL_ENABLED: "true"
      CACHE_LOCAL_TTL: 3600
      # WR-06: webhook global habilitado — instâncias criadas via API/manager
      # herdam esta config e entregam eventos MESSAGES_UPSERT ao Mekano.
      # O header x-webhook-token deve ser configurado na instância
      # (webhookHeaders) com o mesmo valor de EVOLUTION_WEBHOOK_TOKEN (CR-02).
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://mekano:8080/api/v1/webhooks/evolution
      WEBHOOK_GLOBAL_EVENTS: MESSAGES_UPSERT
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    networks:
      - mekano-net

networks:
  mekano-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mekano_secrets:
    driver: local
  evolution_postgres_data:
    driver: local
  evolution_redis_data:
    driver: local
