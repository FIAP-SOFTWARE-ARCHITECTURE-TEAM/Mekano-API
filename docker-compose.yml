services:
  postgres:
    image: postgres:16-alpine
    container_name: mekano-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mekano
      POSTGRES_USER: ${POSTGRES_USER:-mekano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mekano}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-evolution-db.sql:/docker-entrypoint-initdb.d/init-evolution-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mekano} -d mekano" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mekano-net

  keygen:
    image: alpine:3.20
    container_name: mekano-keygen
    command: >
      sh -c "
        if [ ! -f /secrets/privatekey.pem ]; then
          mkdir -p /secrets &&
          apk add --no-cache openssl &&
          openssl genpkey -algorithm Ed25519 -out /secrets/privatekey.pem &&
          openssl pkey -in /secrets/privatekey.pem -pubout -out /secrets/publicKey.pem &&
          chmod 644 /secrets/privatekey.pem /secrets/publicKey.pem &&
          echo 'Key pair generated'
        else
          echo 'Key pair already exists'
        fi
      "
    volumes:
      - mekano_secrets:/secrets
    restart: no
    networks:
      - mekano-net

  mekano:
    build:
      context: .
      dockerfile: mekano-rest/src/main/docker/Dockerfile.jvm
    container_name: mekano-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      QUARKUS_PROFILE: prod
      DB_URL: jdbc:postgresql://postgres:5432/mekano
      DB_USER: ${POSTGRES_USER:-mekano}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mekano}
      SMALLRYE_JWT_SIGN_KEY_LOCATION: file:/home/jboss/.mekano/secrets/privatekey.pem
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: file:/home/jboss/.mekano/secrets/publicKey.pem
      EVOLUTION_API_URL: http://evolution-api:5033
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-dev-key}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-mekano}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:-dev-key}
      MEKANO_PUBLIC_URL: ${MEKANO_PUBLIC_URL:-https://mekano.app}
    volumes:
      - mekano_secrets:/home/jboss/.mekano/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/q/health/live || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - mekano-net

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: mekano-evolution-api
    restart: unless-stopped
    ports:
      - "5033:5033"
    environment:
      SERVER_URL: http://localhost:5033
      SERVER_PORT: "5033"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://mekano:mekano@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_LOCAL_ENABLED: "true"
      CACHE_LOCAL_TTL: 3600
      CACHE_REDIS_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://mekano:8080/api/v1/webhooks/evolution
      WEBHOOK_GLOBAL_EVENTS: MESSAGES_UPSERT
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mekano-net

networks:
  mekano-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mekano_secrets:
    driver: local
